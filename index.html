
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinhala Sub Maker</title>
<style>
body{font-family:Arial,sans-serif;background:#101827;color:white;padding:20px;max-width:650px;margin:auto}
h1{color:#55e6a5}
.box{background:#1e293b;padding:18px;border-radius:14px;margin:15px 0}
button{background:#22c55e;color:#07130c;border:0;padding:12px;border-radius:8px;font-size:16px;margin:8px 0}
textarea{width:100%;height:150px;box-sizing:border-box;border-radius:8px;padding:10px;font-size:16px}
input{max-width:100%;margin:12px 0}
</style>
</head>
<body>
<h1>🇱🇰 Sinhala Sub Maker</h1>
<p>සිංහල උපසිරැසි හදාගන්න ඔයාගේම website එක!</p>

<div class="box">
<h3>1. Subtitle file එක තෝරන්න</h3>
<input type="file" id="file" accept=".srt,.txt">
<button onclick="loadFile()">File එක විවෘත කරන්න</button>
</div>

<div class="box">
<h3>2. Subtitle text</h3>
<textarea id="txt" placeholder="ඔයාගේ subtitle text එක මෙතනට දාන්න..."></textarea>
<button onclick="downloadSrt()">සිංහල Subtitle එක Download කරන්න</button>
</div>

<div class="box">
<h3>3. Video එක තෝරන්න</h3>
<input type="file" id="video" accept="video/*">
<p>Video එකෙන් subtitles ස්වයංක්‍රීයව හදන්න ඉදිරි අදියරේදී AI පහසුකම එකතු කරමු.</p>
</div>

<script>
function loadFile(){
const f=document.getElementById('file').files[0];
if(!f){alert('මුලින් subtitle file එකක් තෝරන්න');return}
const r=new FileReader();
r.onload=()=>document.getElementById('txt').value=r.result;
r.readAsText(f);
}
function downloadSrt(){
const text=document.getElementById('txt').value;
if(!text.trim()){alert('මුලින් subtitle text එක දාන්න');return}
const blob=new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download='sinhala-subtitles.srt';
a.click();
URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
